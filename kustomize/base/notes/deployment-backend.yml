apiVersion: v1
kind: Service
metadata:
  name: notes-backend
spec:
  type: NodePort
  selector:
    app: notes-backend
  ports:
    - port: 4000 # internal cluster port
      targetPort: 4000
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-backend
spec:
  selector:
    matchLabels:
      app: notes-backend
  replicas: 1
  template:
    metadata:
      labels:
        app: notes-backend
    spec:
      containers:
        - name: notes-backend
          image: ghcr.io/alexanderboldt/notes-backend:5.3.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: notes-mysql-secret
            - secretRef:
                name: notes-backend-secret
          ports:
            - containerPort: 4000
